[unix_http_server]
file=/tmp/repairdesk-supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
silent=true
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/repairdesk-supervisord.pid
childlogdir=/tmp

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/repairdesk-supervisor.sock

[program:web]
directory=%(ENV_REPAIRDESK_PROJECT_ROOT)s
command="%(ENV_REPAIRDESK_PYTHON)s" -m gunicorn --config "%(ENV_REPAIRDESK_PROJECT_ROOT)s/gunicorn.conf.py"
autostart=true
autorestart=true
startsecs=5
startretries=5
stopsignal=TERM
stopwaitsecs=35
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:sms_worker]
directory=%(ENV_REPAIRDESK_PROJECT_ROOT)s
command="%(ENV_REPAIRDESK_PYTHON)s" manage.py run_notification_worker --interval 5 --limit 100
autostart=true
autorestart=true
startsecs=5
startretries=5
stopsignal=TERM
stopwaitsecs=25
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[group:repairdesk]
programs=web,sms_worker

[eventlistener:fatal_exit]
directory=%(ENV_REPAIRDESK_PROJECT_ROOT)s
command="%(ENV_REPAIRDESK_PYTHON)s" "%(ENV_REPAIRDESK_PROJECT_ROOT)s/deploy/supervisor_fatal_exit.py"
events=PROCESS_STATE_FATAL
autostart=true
autorestart=true
startsecs=0
priority=1
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
