# Load in nginx's http context, e.g. /etc/nginx/conf.d/default.conf.
# TLS terminates at the PaaS ingress. Enable forced HTTPS there, and verify it
# replaces X-Forwarded-Proto before enabling DJANGO_TRUST_PROXY on the API.
map $http_x_forwarded_proto $repairdesk_scheme {
    default $scheme;
    https https;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 10m;

    location = /healthz/ {
        access_log off;
        default_type application/json;
        add_header Cache-Control no-store;
        return 200 '{"status":"ok"}';
    }

    location ~ ^/(api|admin|static)(/|$) {
        # Replace this host/port with the verified internal service address.
        proxy_pass http://repairdesk-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $repairdesk_scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # Uploaded files are not public by default. Add an authenticated delivery
    # path or explicitly designed public storage when uploads are implemented.
    location /images/ {
        return 404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
